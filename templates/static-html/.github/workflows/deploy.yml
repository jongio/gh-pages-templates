name: Deploy static site to GitHub Pages

# Publishes the repository root as a static site using the official GitHub
# Pages Actions flow. Set Settings → Pages → Source to "GitHub Actions".

on:
  push:
    branches: [__DEFAULT_BRANCH__]
  workflow_dispatch:

# Least-privilege permissions required to deploy to Pages.
permissions:
  contents: read

# Allow one concurrent deployment; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    if: github.ref == 'refs/heads/__DEFAULT_BRANCH__'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - name: Upload artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          # Publish the whole repo root. This template's links are relative,
          # so no base path is needed.
          path: '.'

  deploy:
    if: github.ref == 'refs/heads/__DEFAULT_BRANCH__'
    needs: build
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
