version: 2
updates:
  - package-ecosystem: "npm"
    directories:
      - "/"
      - "/templates/astro"
      - "/templates/eleventy"
      - "/templates/react-vite"
      - "/templates/skills-catalog"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "bundler"
    directory: "/templates/jekyll"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3

  - package-ecosystem: "github-actions"
    directories:
      - "/"
      - "/templates/astro"
      - "/templates/eleventy"
      - "/templates/jekyll"
      - "/templates/react-vite"
      - "/templates/skills-catalog"
      - "/templates/static-html"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 3
